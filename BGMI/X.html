<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #000;
    color: #fff;
    min-height: 100vh;
}

/* Main mobile container */
.container {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    margin: auto;
    padding: 28px 22px 30px;
}

/* X Logo */
.logo {
    width: 55px;
    height: 55px;
    margin: 5px auto 35px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #fff;
    font-size: 58px;
    font-weight: 300;
    line-height: 1;
}

/* Heading */
.title {
    font-size: 52px;
    font-weight: 750;
    line-height: 1.02;
    letter-spacing: -2px;
    margin-bottom: 48px;
}

/* Social buttons */
.social-btn {
    width: 100%;
    height: 58px;

    border: none;
    border-radius: 30px;

    background: #fff;
    color: #111;

    font-size: 17px;
    font-weight: 600;

    margin-bottom: 14px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 13px;

    cursor: pointer;
}

.social-btn:hover {
    background: #e7e7e7;
}

/* Phone icon */
.phone-icon {
    font-size: 23px;
}

/* Google logo */
.google-icon {
    font-size: 23px;
    font-weight: bold;

    background: linear-gradient(
        90deg,
        #4285f4,
        #34a853,
        #fbbc05,
        #ea4335
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* Divider */
.divider {
    display: flex;
    align-items: center;
    gap: 14px;

    margin: 25px 0;

    color: #777;
    font-size: 16px;
}

.divider::before,
.divider::after {
    content: "";
    height: 1px;
    background: #333;
    flex: 1;
}

/* Input boxes */
.input-box {
    position: relative;
    width: 100%;
    margin-bottom: 14px;
}

.input {
    width: 100%;
    height: 65px;

    background: transparent;
    color: #fff;

    border: 2px solid #555;
    border-radius: 18px;

    padding: 0 18px;

    font-size: 17px;
    outline: none;
}

.input::placeholder {
    color: #888;
}

.input:focus {
    border-color: #1d9bf0;
}

/* Password eye */
.password {
    padding-right: 55px;
}

.eye {
    position: absolute;
    right: 18px;
    top: 50%;

    transform: translateY(-50%);

    color: #888;
    font-size: 22px;

    cursor: pointer;
}

/* Forgot password */
.forgot {
    display: block;
    text-align: right;

    color: #1d9bf0;

    font-size: 16px;
    font-weight: 500;

    margin: 12px 5px 28px;

    cursor: pointer;
}

/* Continue button */
.continue {
    width: 100%;
    height: 58px;

    border: none;
    border-radius: 30px;

    background: #333;
    color: #888;

    font-size: 18px;
    font-weight: bold;

    cursor: not-allowed;
}

/* Sign up */
.signup {
    text-align: center;

    margin-top: 45px;

    color: #888;
    font-size: 16px;
}

.signup a {
    color: #1d9bf0;
    text-decoration: none;
    font-weight: 600;
    margin-left: 5px;
}


/* Smaller phones */
@media (max-width: 380px) {

    .container {
        padding: 22px 18px;
    }

    .title {
        font-size: 43px;
        margin-bottom: 38px;
    }

    .social-btn {
        height: 55px;
        font-size: 16px;
    }

    .input {
        height: 60px;
    }
}
</style>
</head>


<body>

<div class="container">

    <!-- X LOGO -->
    <div class="logo">𝕏</div>

    <!-- TITLE -->
    <h1 class="title">
        Happening<br>
        now.
    </h1>


    <!-- PHONE LOGIN -->
    <button class="social-btn">
        <span class="phone-icon">☎</span>
        Continue with phone
    </button>


    <!-- GOOGLE LOGIN -->
    <button class="social-btn">
        <span class="google-icon">G</span>
        Continue with Google
    </button>


    <!-- DIVIDER -->
    <div class="divider">
        or
    </div>


    <!-- USERNAME -->
    <div class="input-box">
        <input
            class="input"
            type="text"
            placeholder="Username"
            autocomplete="off"
        >
    </div>


    <!-- PASSWORD -->
    <div class="input-box">

        <input
            id="password"
            class="input password"
            type="password"
            placeholder="Password"
            autocomplete="off"
        >

        <span
            class="eye"
            onclick="togglePassword()">
            ◉
        </span>

    </div>


    <!-- FORGOT PASSWORD -->
    <div class="forgot">
        Forgot password?
    </div>


    <!-- CONTINUE -->
    <button
        class="continue"
        disabled>
        Continue
    </button>


    <!-- SIGN UP -->
    <div class="signup">
        Don't have an account?
        <a href="#">Sign up</a>
    </div>

</div>


<script>
function togglePassword() {

    const password =
        document.getElementById("password");

    if (password.type === "password") {
        password.type = "text";
    } else {
        password.type = "password";
    }
}
</script>

</body>
</html>
